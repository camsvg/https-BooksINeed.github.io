<!DOCTYPE html>
<html lang="en">
           <head>
           <meta charset="UTF-8">
                         <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                    <title>BOOKSFORCAM.WEB</title>
                                    <style>
.loginbtnstyle {
position:
	absolute;
	right: 20px;
	top: 20px;
}

body {
font-family:
	system-ui, sans-serif;
	max-width: 700px;
	margin: 40px auto;
	padding: 20px;
	line-height: 1.5;
}

.btn,
button {
display:
	inline-block;
	padding: 10px 16px;
	margin: 4px 4px 16px 0;
background-color:
#0070f3;
color:
	white;
text-decoration:
	none;
	border-radius: 6px;
border:
	none;
cursor:
	pointer;
	font-size: 15px;
}

.btn:
hover,
button:
hover {
background-color:
#005bb5;
}

.hidden {
display:
	none;
}

#mainp,
#top2 {
white-space:
pre-line;
}

input {
display:
	block;
	width: 100%;
	max-width: 400px;
	padding: 10px;
	margin-bottom: 10px;
	font-size: 15px;
box-sizing:
	border-box;
}

table {
	width: 100%;
	max-width: 400px;
border-collapse:
	collapse;
	margin-top: 10px;
}

th,
td {
	padding: 10px 14px;
text-align:
	left;
	border-bottom: 1px solid #ddd;
}

th {
background-color:
#0070f3;
color:
	white;
}

th:
last-child,
td:
last-child {
text-align:
	right;
}

tr:
nth-child(even) {
background-color:
#f9f9f9;
}
</style>
</head>
<body>
<h1 id="mainh">Cam's Online Book List & More</h1>
       <p id="mainp">__Developed_By_Cameron_Threadgill__\n__Version-Alpha.2.1._______________</p>

             <div>
             <button id="veiwlstbtn">View List</button>
                        <button id="updatebtn">Update Books</button>
                                   <button id="leaderboardbrd">Leader Board</button>
                                           <button id="Readmebtn">ReadMe</button>
                                                   <button id="adminloginbtn" class="loginbtnstyle">Admin Login</button>
	                                                           </div>

	                                                           <!-- Admin Sections (Hidden by default) -->
	                                                           <div id="adminloginPanle" class="hidden">
		                                                                   <input type="text" placeholder="Enter Username" name="Username">
		                                                                           <input type="password" placeholder="Enter Password" name="Password">
		                                                                                   <button id="submitLoginBtn">Login</button>
		                                                                                           </div>

		                                                                                           <div id="AdminPanle" class="hidden">
			                                                                                                   <button id="lupdatebtn">Update Leaderboard</button>
			                                                                                                           <button id="bupdatebtn">Update Books</button>
			                                                                                                                   </div>

			                                                                                                                   <div id="adminupdatel" class="hidden">
				                                                                                                                           <input type="text" placeholder="Enter Name" name="Name">
				                                                                                                                                   <input type="number" placeholder="Enter Score" name="Score">
				                                                                                                                                           <button id="saveLeaderboardBtn">Save Contributor</button>
				                                                                                                                                                   </div>

				                                                                                                                                                   <div id="updateb" class="hidden">
					                                                                                                                                                           <button id="add">Add Book</button>
					                                                                                                                                                                   <button id="del">Delete Book</button>
					                                                                                                                                                                           <button id="edit">Edit Book</button>
					                                                                                                                                                                                   </div>

					                                                                                                                                                                                   <div id="addfrm" class="hidden">
						                                                                                                                                                                                           <input type="text" placeholder="Enter Book Name" name="bn">
						                                                                                                                                                                                                   <input type="text" placeholder="Enter PDF Link" name="PDFLK">
						                                                                                                                                                                                                           <button id="confirmAddBtn">Save New Book</button>
						                                                                                                                                                                                                                   </div>

						                                                                                                                                                                                                                   <div id="delfrm" class="hidden">
							                                                                                                                                                                                                                           <input type="text" placeholder="Exact Book Name to Delete" name="bkv">
							                                                                                                                                                                                                                                   <button id="confirmDelBtn">Confirm Delete</button>
							                                                                                                                                                                                                                                           </div>

							                                                                                                                                                                                                                                           <div id="editbkfrm" class="hidden">
								                                                                                                                                                                                                                                                   <input type="text" placeholder="Current Book Name" name="ebn">
								                                                                                                                                                                                                                                                           <input type="text" placeholder="New Book Title" name="nt">
								                                                                                                                                                                                                                                                                   <button id="confirmEditBtn">Confirm Edit</button>
								                                                                                                                                                                                                                                                                           </div>

								                                                                                                                                                                                                                                                                           <!-- Main Content Views -->
								                                                                                                                                                                                                                                                                           <div id="bookSection" class="hidden">
									                                                                                                                                                                                                                                                                                   <h2 id="top1"></h2>
									                                                                                                                                                                                                                                                                                           <p id="top2"></p>
									                                                                                                                                                                                                                                                                                                   <ul id="bookList"></ul>
									                                                                                                                                                                                                                                                                                                           </div>

									                                                                                                                                                                                                                                                                                                           <div id="formContainer"></div>
									                                                                                                                                                                                                                                                                                                                   <p id="statusText"></p>

									                                                                                                                                                                                                                                                                                                                           <table id="leaderboardTable" class="hidden">
										                                                                                                                                                                                                                                                                                                                                   <thead>
										                                                                                                                                                                                                                                                                                                                                   <tr>
										                                                                                                                                                                                                                                                                                                                                   <th>Rank</th>
										                                                                                                                                                                                                                                                                                                                                   <th>Contributor</th>
										                                                                                                                                                                                                                                                                                                                                   <th>Books</th>
										                                                                                                                                                                                                                                                                                                                                   </tr>
										                                                                                                                                                                                                                                                                                                                                   </thead>
										                                                                                                                                                                                                                                                                                                                                   <tbody id="leaderboardBody"></tbody>
										                                                                                                                                                                                                                                                                                                                                           </table>

										                                                                                                                                                                                                                                                                                                                                           <script>
										                                                                                                                                                                                                                                                                                                                                           const apass = "c22345223456T";
const auser = "CameronT";

const defaultBooks = [
 {
 id: "Book1",
 href: "https://anarcho-copy.org",
 title: '"Linux Bible, 10th Edition" by Christopher Negus',
 info: ""
 },
 {
 id: "Book2",
 href: "https://knu.edu.af",
 title: '"Advanced Linux Programming" by Mark Mitchell, Jeffrey David Oldham, Alex Samuel',
 info: ""
 },
 {
 id: "Book3",
 href: "https://github.com",
 title: '"Android NDK Beginner\'s Guide" by Sylvain Ratabouil',
 info: ""
 },
 {
 id: "Book4",
 href: "https://hws.edu",
 title: '"Introduction to Programming Using Java" by David J. Eck',
 info: ""
 },
 {
 id: "Book5",
 href: "https://github.com",
 title: "HTML5 Notes for Professionals",
 info: ""
 },
 {
 id: "Book6",
 href: "https://hal.science",
 title: '"Modern C" by Jens Gustedt',
 info: ""
 },
 {
 id: "Book7",
 href: "https://gulf.edu.sa",
 title: "The Internet For Dummies",
 info: ""
 }
 ];

const defaultLeaderboard = [
 { name: "MsMcCrimmon", score: 3 },
 { name: "MsAlston", score: 2 },
 { name: "MsForbes", score: 1 }
 ];

// Load saved data from localStorage or fall back to defaults
let books = JSON.parse(localStorage.getItem("camBooks")) || defaultBooks;
let leaderboard = JSON.parse(localStorage.getItem("camLeaderboard")) || defaultLeaderboard;
let bookcount = books.length;

function saveData() {
	localStorage.setItem("camBooks", JSON.stringify(books));
	localStorage.setItem("camLeaderboard", JSON.stringify(leaderboard));
}

const mainh = document.getElementById("mainh");
const mainp = document.getElementById("mainp");
const loginbtn = document.getElementById("adminloginbtn");
const adminLogin = document.getElementById("adminloginPanle");
const adminPanle = document.getElementById("AdminPanle");
const updateLeaderboard = document.getElementById("adminupdatel");
const updateBooks = document.getElementById("updateb");
const ubEdit = document.getElementById("editbkfrm");
const ubAdd = document.getElementById("addfrm");
const ubDel = document.getElementById("delfrm");

const bookSection = document.getElementById("bookSection");
const bookList = document.getElementById("bookList");
const formContainer = document.getElementById("formContainer");
const statusText = document.getElementById("statusText");
const leaderboardTable = document.getElementById("leaderboardTable");
const tbody = document.getElementById("leaderboardBody");

function resetViews() {
	bookSection.classList.add("hidden");
	leaderboardTable.classList.add("hidden");
	adminLogin.classList.add("hidden");
	adminPanle.classList.add("hidden");
	updateLeaderboard.classList.add("hidden");
	updateBooks.classList.add("hidden");
	ubAdd.classList.add("hidden");
	ubDel.classList.add("hidden");
	ubEdit.classList.add("hidden");
	formContainer.innerHTML = "";
	statusText.textContent = "";
}

function chkcred() {
	const user = document.querySelector('input[name="Username"]').value.trim();
	const pass = document.querySelector('input[name="Password"]').value;
	return user === auser && pass === apass;
}

// View List
document.getElementById("veiwlstbtn").addEventListener("click", () => {
	resetViews();
	mainh.textContent = "Welcome BOOKSFORCAM Online Webpage";
	mainp.textContent = "Developed By Cameron Threadgill.";

	const top1 = document.getElementById("top1");
	const top2 = document.getElementById("top2");
	top1.textContent = "Cam’s Software Development Reference Library Book List";
	top1.style.textDecoration = "underline";
	top2.textContent =
	    "WEBPAGE V.ALPHA(1.0) |\nupdated on November 4 2026 | Please return printed material to the residence of Cameron .T (room 17 on unit 361)";
	top2.style.textDecoration = "underline";

	bookList.innerHTML = "";
	for (const book of books) {
		const li = document.createElement("li");
		li.id = book.id;
		li.innerHTML = `<a href="${book.href}" target="_blank">$ {book.title}</a>`;
		bookList.appendChild(li);
	}
	bookSection.classList.remove("hidden");
});

// Public Suggest/Update Books Form
document.getElementById("updatebtn").addEventListener("click", () => {
	resetViews();
	mainh.textContent = "Suggest or Update a Book";
	mainp.textContent = "Fill out the form below to send a book request to Cameron.";

	formContainer.innerHTML = `
	                          <form id="responseForm">
	                                   <input type="hidden" name="access_key" value="8946415d-c8b4-4db7-bf25-a6ee27e7b791">
	                                           <input type="text" id="userInputBN" name="BOOK TITLE" placeholder="Book Name" required>
	                                                   <input type="text" id="userInputDT" name="Date" placeholder="Date" required>
	                                                           <input type="text" id="userInputMSG" name="Message" placeholder="Message (optional)">
	                                                                   <input type="text" id="userInputPN" name="NAME" placeholder="Your name (for leaderboard, optional)">
	                                                                           <button type="submit" id="submitBtn">Submit</button>
	                                                                                   </form>
	                                                                                   `;
});
const form = document.getElementById("responseForm");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
	e.preventDefault();
	submitBtn.disabled = true;
	statusText.textContent = "Sending...";
	const formData = new FormData(form);
	try {
		const response = await fetch("https://api.web3forms.com/submit", {
method: "POST",
body: formData
		});
		const result = await response.json();
		if (result.success) {
			statusText.textContent = "Response sent!";
			form.reset();
		} else {
			statusText.textContent = "Submission failed. Please try again.";
		}
	} catch (error) {
		statusText.textContent = "Network error. Please try again.";
	}
	finally {
		submitBtn.disabled = false;
	}
});
});
// Leaderboard
document.getElementById("leaderboardbrd").addEventListener("click", () => {
	resetViews();
	mainh.textContent = "Contributor Leader Board";
	mainp.textContent = "Top contributors to Cam's library:";
	tbody.innerHTML = "";
	leaderboard
	.sort((a, b) => b.score - a.score)
	.forEach((entry, index) => {
		const row = document.createElement("tr");
		row.innerHTML = `
#${index + 1}
		                $ {entry.name}
		                $ {entry.score}
		                `;
		tbody.appendChild(row);
	});
	leaderboardTable.classList.remove("hidden");
});
// ReadMe
document.getElementById("Readmebtn").addEventListener("click", () => {
	resetViews();
	mainh.textContent = "README Page";
	mainp.textContent =
	    Please print everything default.\nThank you for contributing to my constant strive for knowledge,\nsincerely Cameron Threadgill.;
});
// Admin Login Button
loginbtn.addEventListener("click", () => {
	resetViews();
	mainh.textContent = "Welcome To The Admin Access Panel";
	mainp.textContent = "Please Enter Credentials";
	adminLogin.classList.remove("hidden");
});
// Check Credentials on Login Submit
document.getElementById("submitLoginBtn").addEventListener("click", () => {
	if (chkcred()) {
		resetViews();
		mainh.textContent = "Admin Control Panel";
		mainp.textContent = "Select an action below:";
		adminPanle.classList.remove("hidden");
	} else {
		statusText.textContent = "Invalid username or password.";
	}
});
// Admin: Open Book Controls
document.getElementById("bupdatebtn").addEventListener("click", () => {
	updateLeaderboard.classList.add("hidden");
	updateBooks.classList.remove("hidden");
	statusText.textContent = "";
});
// Show Add / Delete / Edit Sub-forms
document.getElementById("add").addEventListener("click", () => {
	ubAdd.classList.remove("hidden");
	ubDel.classList.add("hidden");
	ubEdit.classList.add("hidden");
});
document.getElementById("del").addEventListener("click", () => {
	ubDel.classList.remove("hidden");
	ubAdd.classList.add("hidden");
	ubEdit.classList.add("hidden");
});
document.getElementById("edit").addEventListener("click", () => {
	ubEdit.classList.remove("hidden");
	ubAdd.classList.add("hidden");
	ubDel.classList.add("hidden");
});
// Confirm Add Book
document.getElementById("confirmAddBtn").addEventListener("click", () => {
	const bookName = document.querySelector('input[name="bn"]').value.trim();
	const bookLink = document.querySelector('input[name="PDFLK"]').value.trim();
	if (!bookName || !bookLink) {
		statusText.textContent = "Please enter both a book name and a PDF link.";
		return;
	}
	++bookcount;
	books.push({ id: "Book" + bookcount, href: bookLink, title: bookName, info: "" });
	saveData();
	statusText.textContent = Added "${bookName}"!;
	document.querySelector('input[name="bn"]').value = "";
	document.querySelector('input[name="PDFLK"]').value = "";
});
// Confirm Delete Book
document.getElementById("confirmDelBtn").addEventListener("click", () => {
	const bn = document.querySelector('input[name="bkv"]').value.trim().toLowerCase();
	const initialLength = books.length;
	books = books.filter(book => book.title.toLowerCase() !== bn);
	if (books.length < initialLength) {
		saveData();
		statusText.textContent = "Book deleted!";
		document.querySelector('input[name="bkv"]').value = "";
	} else {
		statusText.textContent = "No matching book found.";
	}
});
// Confirm Edit Book
document.getElementById("confirmEditBtn").addEventListener("click", () => {
	const targetName = document.querySelector('input[name="ebn"]').value.trim().toLowerCase();
	const newText = document.querySelector('input[name="nt"]').value.trim();
	const targetObj = books.find(b => b.title.toLowerCase() === targetName);
	if (targetObj && newText) {
		targetObj.title = newText;
		saveData();
		statusText.textContent = "Book updated!";
		document.querySelector('input[name="ebn"]').value = "";
		document.querySelector('input[name="nt"]').value = "";
	} else {
		statusText.textContent = "Book not found or new title is empty.";
	}
});
// Admin: Open Leaderboard Controls
document.getElementById("lupdatebtn").addEventListener("click", () => {
	updateBooks.classList.add("hidden");
	ubAdd.classList.add("hidden");
	ubDel.classList.add("hidden");
	ubEdit.classList.add("hidden");
	updateLeaderboard.classList.remove("hidden");
	statusText.textContent = "";
});
// Save/Update Leaderboard Entry
document.getElementById("saveLeaderboardBtn").addEventListener("click", () => {
	const name = document.querySelector('input[name="Name"]').value.trim();
	const score = parseInt(document.querySelector('input[name="Score"]').value, 10);
	if (!name || isNaN(score)) {
		statusText.textContent = "Please enter a valid name and score.";
		return;
	}
	const existing = leaderboard.find(entry => entry.name.toLowerCase() === name.toLowerCase());
	if (existing) {
		existing.score = score;
	} else {
		leaderboard.push({ name, score });
	}
	saveData();
	statusText.textContent = Updated leaderboard for $ {name}!;
document.querySelector('input[name="Name"]').value = "";
	document.querySelector('input[name="Score"]').value = "";
});
</script>
</body>
</html>
