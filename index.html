<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOKSFORCAM</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
    }
    button {
      display: inline-block;
      padding: 10px 16px;
      margin: 4px 4px 16px 0;
      background-color: #0070f3;
      color: white;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover {
      background-color: #005bb5;
    }
    .hidden {
      display: none;
    }
    #mainp, #top2 {
      white-space: pre-line;
    }
    input {
      display: block;
      width: 100%;
      max-width: 400px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }
    table {
      width: 100%;
      max-width: 400px;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #0070f3;
      color: white;
    }
    th:last-child, td:last-child {
      text-align: right;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>

  <h1 id="mainh">Welcome BOOKSFORCAM Online Webpage</h1>
  <p id="mainp">Developed By Cameron Threadgill.</p>

  <div>
    <button type="button" id="veiwlstbtn">View List</button>
    <button type="button" id="updatebtn">Update Books</button>
    <button type="button" id="leaderboardbrd">Leader Board</button>
    <button type="button" id="Readmebtn">ReadMe</button>
    <button type="button" id="adminTabBtn">Admin Login</button>
  </div>

  <div id="bookSection" class="hidden">
    <h2 id="top1"></h2>
    <p id="top2"></p>
    <ul id="bookList"></ul>
  </div>

  <div id="formContainer"></div>
  <p id="statusText"></p>

  <table id="leaderboardTable" class="hidden">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Contributor</th>
        <th>Books</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody"></tbody>
  </table>

  <div id="adminSection" class="hidden">
    <div id="loginBox">
      <h3>Admin Authentication</h3>
      <input type="text" id="usernameInput" placeholder="Username">
      <input type="password" id="passwordInput" placeholder="Password">
      <button type="button" id="logbtn">Login</button>
      <p id="loginMsg"></p>
    </div>

    <div id="adminPanel" class="hidden">
      <h3>Update Leaderboard (Logged in as CameronT)</h3>
      <input type="text" id="contribName" placeholder="Contributor Name">
      <input type="number" id="contribScore" placeholder="Score / Books Contributed">
      <button type="button" id="updateScoreBtn">Add / Update Score</button>
      <p id="adminMsg"></p>
    </div>
  </div>

  <script>
    const EXPECTED_USER = "CameronT";
    const EXPECTED_HASH = "e02dfbfd31c75b2349592ea389022cbb231c33342d4decccf6f2ffdd9d5a6b21";
    let isAdminLoggedIn = false;

    const books = [
      { id: "Book1", href: "https://anarcho-copy.org", title: '"Linux Bible, 10th Edition" by Christopher Negus' },
      { id: "Book2", href: "https://knu.edu.af", title: '"Advanced Linux Programming" by Mark Mitchell, Jeffrey David Oldham, Alex Samuel' },
      { id: "Book3", href: "https://github.com", title: '"Android NDK Beginner\'s Guide" by Sylvain Ratabouil' },
      { id: "Book4", href: "https://hws.edu", title: '"Introduction to Programming Using Java" by David J. Eck' },
      { id: "Book5", href: "https://github.com", title: "HTML5 Notes for Professionals" },
      { id: "Book6", href: "https://hal.science", title: '"Modern C" by Jens Gustedt' },
      { id: "Book7", href: "https://gulf.edu.sa", title: "The Internet For Dummies" }
    ];

    const defaultLeaderboard = [
      { name: "MsMcCrimmon", score: 3 },
      { name: "MsAlston", score: 2 },
      { name: "MsForbes", score: 1 }
    ];
    let leaderboard = JSON.parse(localStorage.getItem("camLeaderboard")) || defaultLeaderboard;

    const mainh = document.getElementById("mainh");
    const mainp = document.getElementById("mainp");
    const bookSection = document.getElementById("bookSection");
    const bookList = document.getElementById("bookList");
    const formContainer = document.getElementById("formContainer");
    const statusText = document.getElementById("statusText");
    const leaderboardTable = document.getElementById("leaderboardTable");
    const tbody = document.getElementById("leaderboardBody");
    const adminSection = document.getElementById("adminSection");

    async function sha256(message) {
      if (!window.crypto || !window.crypto.subtle) {
        alert("SHA-256 requires HTTPS (GitHub Pages) or localhost. Open this via GitHub Pages to log in.");
        return "";
      }
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function resetViews() {
      bookSection.classList.add("hidden");
      leaderboardTable.classList.add("hidden");
      adminSection.classList.add("hidden");
      formContainer.innerHTML = "";
      statusText.textContent = "";
    }

    function renderLeaderboard() {
      tbody.innerHTML = "";
      leaderboard
        .sort((a, b) => b.score - a.score)
        .forEach((entry, index) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>#${index + 1}</td>
            <td>${entry.name}</td>
            <td>${entry.score}</td>
          `;
          tbody.appendChild(row);
        });
    }

    document.getElementById("veiwlstbtn").addEventListener("click", () => {
      resetViews();
      mainh.textContent = "Welcome BOOKSFORCAM Online Webpage";
      mainp.textContent = "Developed By Cameron Threadgill.";

      const top1 = document.getElementById("top1");
      const top2 = document.getElementById("top2");
      top1.textContent = "Cam’s Software Development Reference Library Book List";
      top1.style.textDecoration = "underline";
      top2.textContent = "WEBPAGE V.ALPHA(1.0) |\nupdated on November 4 2026 | Please return printed material to the residence of Cameron .T (room 17 on unit 361)";
      top2.style.textDecoration = "underline";

      bookList.innerHTML = "";
      for (const book of books) {
        const li = document.createElement("li");
        li.id = book.id;
        li.innerHTML = `<a href="${book.href}" target="_blank">${book.title}</a>`;
        bookList.appendChild(li);
      }
      bookSection.classList.remove("hidden");
    });

    document.getElementById("updatebtn").addEventListener("click", () => {
      resetViews();
      mainh.textContent = "Suggest or Update a Book";
      mainp.textContent = "Fill out the form below to send a book request to Cameron.";

      formContainer.innerHTML = `
        <form id="responseForm">
          <input type="hidden" name="access_key" value="8946415d-c8b4-4db7-bf25-a6ee27e7b791">
          <input type="text" id="userInputBN" name="BOOK TITLE" placeholder="Book Name" required>
          <input type="text" id="userInputDT" name="Date" placeholder="Date" required>
          <input type="text" id="userInputMSG" name="Message" placeholder="Message (optional)">
          <input type="text" id="userInputPN" name="NAME" placeholder="Your name (for leaderboard, optional)">
          <button type="submit" id="submitBtn">Submit</button>
        </form>
      `;

      const form = document.getElementById("responseForm");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        statusText.textContent = "Sending...";
        const formData = new FormData(form);

        try {
          const response = await fetch("https://web3forms.com", {
            method: "POST",
            body: formData
          });
          const result = await response.json();
          if (result.success) {
            statusText.textContent = "Response sent!";
            form.reset();
          } else {
            statusText.textContent = "Submission failed. Please try again.";
          }
        } catch (error) {
          console.error(error);
          statusText.textContent = "Network error. Please try again.";
        } finally {
          submitBtn.disabled = false;
        }
      });
    });

    document.getElementById("leaderboardbrd").addEventListener("click", () => {
      resetViews();
      mainh.textContent = "Contributor Leader Board";
      mainp.textContent = "Top contributors to Cam's library:";
      renderLeaderboard();
      leaderboardTable.classList.remove("hidden");
    });

    document.getElementById("Readmebtn").addEventListener("click", () => {
      resetViews();
      mainh.textContent = "README Page";
      mainp.textContent = `Please print everything default.\nThank you for contributing to my constant strive for knowledge,\nsincerely Cameron Threadgill.`;
    });

    document.getElementById("adminTabBtn").addEventListener("click", () => {
      resetViews();
      mainh.textContent = "Admin Controls";
      mainp.textContent = isAdminLoggedIn ? "Manage the contributor leaderboard below:" : "Log in to manage the leaderboard.";
adminSection.classList.remove("hidden");
renderLeaderboard();
leaderboardTable.classList.remove("hidden");
});
document.getElementById("logbtn").addEventListener("click", async () => {
const user = document.getElementById("usernameInput").value.trim();
const pass = document.getElementById("passwordInput").value;
const loginMsg = document.getElementById("loginMsg");
const enteredHash = await sha256(pass);
if (user === EXPECTED_USER && enteredHash === EXPECTED_HASH) {
isAdminLoggedIn = true;
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("adminPanel").classList.remove("hidden");
mainp.textContent = "Manage the contributor leaderboard below:";
} else {
loginMsg.textContent = "Invalid username or password.";
loginMsg.style.color = "red";
}
});
document.getElementById("updateScoreBtn").addEventListener("click", () => {
const nameInput = document.getElementById("contribName").value.trim();
const scoreInput = Number(document.getElementById("contribScore").value);
const adminMsg = document.getElementById("adminMsg");
if (!nameInput || isNaN(scoreInput)) {
adminMsg.textContent = "Please enter both a valid name and number.";
adminMsg.style.color = "red";
return;
}
const existing = leaderboard.find(p => p.name.toLowerCase() === nameInput.toLowerCase());
if (existing) {
existing.score = scoreInput;
} else {
leaderboard.push({ name: nameInput, score: scoreInput });
}
localStorage.setItem("camLeaderboard", JSON.stringify(leaderboard));
renderLeaderboard();
adminMsg.textContent = Updated ${nameInput} to ${scoreInput}!;
adminMsg.style.color = "green";
document.getElementById("contribName").value = "";
document.getElementById("contribScore").value = "";
});
